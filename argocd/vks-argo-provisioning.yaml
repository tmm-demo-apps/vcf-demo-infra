apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vks-argo-provisioning
  namespace: infra-fbhdn
spec:
  project: infra
  sources:
    - repoURL: https://github.com/tmm-demo-apps/vcf-demo-infra.git
      targetRevision: HEAD
      path: infrastructure/clusters/overlays/prod
    - repoURL: https://github.com/tmm-demo-apps/vcf-demo-infra.git
      targetRevision: HEAD
      path: infrastructure/addons/overlays/prod
  destination:
    name: supervisor
    namespace: prod-2r8k2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
